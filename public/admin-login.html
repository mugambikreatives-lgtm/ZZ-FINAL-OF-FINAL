<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Zenith Zoom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Gradient blobs matching homepage */
    .blob { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
    .blob-purple { width: 520px; height: 520px; background: #c4b5fd; opacity: 0.35; top: -130px; left: -100px; }
    .blob-green  { width: 300px; height: 300px; background: #86efac; opacity: 0.25; bottom: -80px; left: 80px; }
    .blob-yellow { width: 340px; height: 340px; background: #fde68a; opacity: 0.3;  bottom: -100px; right: -60px; }
    .blob-blue   { width: 260px; height: 260px; background: #bfdbfe; opacity: 0.3;  top: 60px; right: -40px; }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 20px;
      padding: 48px 52px 44px;
      width: 440px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 10px 40px rgba(0,0,0,0.08);
    }

    /* Logo matching homepage nav */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: #7c3aed;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon svg { width: 20px; height: 20px; }
    .logo-wordmark {
      font-size: 22px; font-weight: 800;
      color: #111827; letter-spacing: -0.4px;
    }
    .logo-wordmark span { color: #7c3aed; }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 36px;
      font-weight: 400;
    }

    .divider {
      display: flex; align-items: center; gap: 14px; margin-bottom: 28px;
    }
    .divider-line { flex: 1; height: 1px; background: #e5e7eb; }
    .divider-label {
      font-size: 11px; color: #9ca3af; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
    }

    .field { margin-bottom: 18px; }
    label {
      display: block; font-size: 13px; font-weight: 600;
      color: #374151; margin-bottom: 7px;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      color: #111827;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
      background: #fff;
    }
    input::placeholder { color: #d1d5db; }

    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 13px;
      border-radius: 10px;
      padding: 11px 16px;
      margin-bottom: 4px;
    }
    .error-msg.show { display: block; }

    /* CTA button — dark pill like "Browse Courses" on homepage */
    .btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: #111827;
      border: none;
      border-radius: 50px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      letter-spacing: 0.01em;
    }
    .btn:hover:not(:disabled) {
      background: #1f2937;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .btn:active:not(:disabled) { transform: scale(0.99); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn svg { width: 16px; height: 16px; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Trust row — matches homepage checkmarks */
    .trust {
      display: flex; justify-content: center; gap: 20px; margin-top: 22px;
    }
    .trust-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: #6b7280;
    }
    .trust-item::before {
      content: '✓';
      color: #7c3aed;
      font-weight: 700;
      font-size: 11px;
    }

    .back {
      display: block; text-align: center; margin-top: 22px;
      font-size: 13px; color: #9ca3af; text-decoration: none;
      transition: color 0.15s;
    }
    .back:hover { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="blob blob-purple"></div>
  <div class="blob blob-green"></div>
  <div class="blob blob-yellow"></div>
  <div class="blob blob-blue"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 5l7 5-7 5V5zm7 0l7 5-7 5V5z" fill="white"/>
        </svg>
      </div>
      <div class="logo-wordmark">Zenith<span> Zoom</span></div>
    </div>
    <p class="subtitle">Admin Panel — Authorized Access Only</p>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-label">Sign in to continue</span>
      <div class="divider-line"></div>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="admin@zenithzoom.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button class="btn" id="login-btn" onclick="handleLogin()">
      <span id="btn-text">Sign In to Admin Panel</span>
      <div class="spinner" id="spinner"></div>
      <svg id="btn-arrow" viewBox="0 0 16 16" fill="none">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="trust">
      <span class="trust-item">View instantly</span>
      <span class="trust-item">Secure access</span>
      <span class="trust-item">Encrypted</span>
    </div>

    <a href="/" class="back">← Back to Zenith Zoom</a>
  </div>

  <script>
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const spinner = document.getElementById('spinner');
      const arrow = document.getElementById('btn-arrow');
      const btnText = document.getElementById('btn-text');
      const errorMsg = document.getElementById('error-msg');

      errorMsg.classList.remove('show');
      if (!email || !password) { showError('Please enter your email and password.'); return; }

      btn.disabled = true;
      spinner.style.display = 'block';
      arrow.style.display = 'none';
      btnText.textContent = 'Signing in...';

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          btnText.textContent = 'Redirecting...';
          window.location.href = data.redirect || '/admin/dashboard';
        } else {
          showError(data.message || 'Invalid credentials. Please try again.');
          resetBtn();
        }
      } catch {
        showError('Connection error. Please try again.');
        resetBtn();
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg; el.classList.add('show');
    }
    function resetBtn() {
      document.getElementById('login-btn').disabled = false;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('btn-arrow').style.display = 'block';
      document.getElementById('btn-text').textContent = 'Sign In to Admin Panel';
    }
  </script>
</body>
</html>
