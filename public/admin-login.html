<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Zenith Zoom</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal: #00C2D4;
      --teal-dark: #009BAB;
      --teal-glow: rgba(0,194,212,0.12);
      --teal-border: rgba(0,194,212,0.15);
      --dark:  #070B14;
      --dark2: #0D1525;
      --dark3: #141E32;
      --card:  #111827;
      --text:  #E8EDF5;
      --muted: #8896AE;
      --error: #EF4444;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --radius: 10px;
    }

    body {
      min-height: 100vh;
      background: var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      position: relative;
      overflow: hidden;
    }

    /* Background grid lines */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,194,212,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,194,212,0.04) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    /* Teal glow orb */
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,194,212,0.1) 0%, transparent 65%);
      top: 50%; left: 50%;
      transform: translate(-50%, -60%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--teal-border);
      border-radius: 16px;
      padding: 44px 48px 40px;
      width: 420px;
      box-shadow: 0 0 0 1px rgba(0,194,212,0.05), 0 24px 60px rgba(0,0,0,0.5);
    }

    /* Teal top accent line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--teal), transparent);
      border-radius: 16px 16px 0 0;
    }

    /* Corner brackets */
    .corner { position: absolute; width: 14px; height: 14px; border-color: rgba(0,194,212,0.4); border-style: solid; }
    .corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 2px 0 0 0; }
    .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; border-radius: 0 2px 0 0; }
    .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; border-radius: 0 0 0 2px; }
    .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 2px 0; }

    .logo {
      text-align: center;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    .logo span { color: var(--teal); }

    .subtitle {
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 32px;
      letter-spacing: 0.01em;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .divider-line { flex: 1; height: 1px; background: var(--teal-border); }
    .divider-label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      font-family: var(--font-body);
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: var(--dark2);
      border: 1px solid var(--teal-border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.88rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,194,212,0.1);
    }
    input::placeholder { color: var(--muted); opacity: 0.6; }

    .error-msg {
      display: none;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      color: #FCA5A5;
      font-size: 13px;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 4px;
      font-family: var(--font-body);
    }
    .error-msg.show { display: block; }

    .btn {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: var(--teal);
      border: none;
      border-radius: 8px;
      color: var(--dark);
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    }
    .btn:hover:not(:disabled) {
      background: var(--teal-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0,194,212,0.3);
    }
    .btn:active:not(:disabled) { transform: scale(0.99); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn svg { width: 16px; height: 16px; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(7,11,20,0.3);
      border-top-color: var(--dark);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--teal-border);
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--teal);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-text {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      font-family: var(--font-body);
      transition: color 0.2s;
    }
    .back:hover { color: var(--teal); }
  </style>
</head>
<body>
  <div class="card">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="logo">Zenith<span>Zoom</span></div>
    <p class="subtitle">Admin Panel — Authorized Access Only</p>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-label">Sign in to continue</span>
      <div class="divider-line"></div>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="admin@zenithzoom.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button class="btn" id="login-btn" onclick="handleLogin()">
      <span id="btn-text">Sign In to Admin Panel</span>
      <div class="spinner" id="spinner"></div>
      <svg id="btn-arrow" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="#070B14" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="status-bar">
      <div class="status-dot"></div>
      <span class="status-text">Secured connection active</span>
    </div>

    <a href="/" class="back">← Back to Zenith Zoom</a>
  </div>

  <script>
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const spinner = document.getElementById('spinner');
      const arrow = document.getElementById('btn-arrow');
      const btnText = document.getElementById('btn-text');
      const errorMsg = document.getElementById('error-msg');

      errorMsg.classList.remove('show');

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      btn.disabled = true;
      spinner.style.display = 'block';
      arrow.style.display = 'none';
      btnText.textContent = 'Signing in...';

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          btnText.textContent = 'Redirecting...';
          window.location.href = data.redirect || '/admin/dashboard';
        } else {
          showError(data.message || 'Invalid credentials. Please try again.');
          resetBtn();
        }
      } catch (err) {
        showError('Connection error. Please try again.');
        resetBtn();
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('show');
    }

    function resetBtn() {
      const btn = document.getElementById('login-btn');
      const spinner = document.getElementById('spinner');
      const arrow = document.getElementById('btn-arrow');
      const btnText = document.getElementById('btn-text');
      btn.disabled = false;
      spinner.style.display = 'none';
      arrow.style.display = 'block';
      btnText.textContent = 'Sign In to Admin Panel';
    }
  </script>
</body>
</html>
