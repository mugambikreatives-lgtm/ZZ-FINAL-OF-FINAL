<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Zenith Zoom</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #00C2D4; --dark: #070B14; --dark2: #0D1525; --card: #111827;
  --border: rgba(0,194,212,0.15); --text: #E8EDF5; --muted: #8896AE;
  --error: #EF4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.bg { position: fixed; inset: 0; background: radial-gradient(ellipse 60% 60% at 50% 40%, rgba(0,194,212,0.06) 0%, transparent 70%); pointer-events: none; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 400px; position: relative; animation: up 0.5s ease; }
@keyframes up { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform:translateY(0); } }
.logo { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 8px; }
.logo span { color: var(--teal); }
.subtitle { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 36px; }
.form-group { margin-bottom: 18px; }
label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
input {
  width: 100%; padding: 12px 16px; background: var(--dark2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.92rem; outline: none; transition: 0.2s;
}
input:focus { border-color: var(--teal); }
input::placeholder { color: var(--muted); }
.btn {
  width: 100%; padding: 13px; background: var(--teal); color: #070B14; border: none;
  border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 700;
  cursor: pointer; transition: 0.2s; margin-top: 8px;
}
.btn:hover { opacity: 0.9; transform: translateY(-1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.error-msg { background: rgba(239,68,68,0.1); color: var(--error); border-radius: 8px; padding: 10px 14px; font-size: 0.83rem; margin-top: 14px; display: none; }
.back-link { display: block; text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 20px; text-decoration: none; }
.back-link:hover { color: var(--teal); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="logo">Zenith<span>Zoom</span></div>
  <div class="subtitle">Admin Panel — Authorized Access Only</div>
  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="admin@zenithzoom.com" onkeydown="if(event.key==='Enter')login()">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
  </div>
  <button class="btn" id="login-btn" onclick="login()">Sign In to Admin Panel</button>
  <div class="error-msg" id="error-msg"></div>
  <a class="back-link" href="/">← Back to Zenith Zoom</a>
</div>
<script>
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('error-msg');
  if (!email || !password) { showErr('Please enter your email and password.'); return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  err.style.display = 'none';
  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success) { window.location.href = data.redirect || '/admin/dashboard'; }
    else { showErr(data.message || 'Invalid credentials.'); }
  } catch { showErr('Network error. Please try again.'); }
  btn.disabled = false; btn.textContent = 'Sign In to Admin Panel';
}
function showErr(msg) {
  const e = document.getElementById('error-msg');
  e.textContent = '❌ ' + msg; e.style.display = 'block';
}
</script>
</body>
</html>
