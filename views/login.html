<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In — Zenith Zoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple: #7c3aed;
  --purple-light: #ede9fe;
  --dark: #111827;
  --text: #111827;
  --muted: #6b7280;
  --border: #e5e7eb;
  --surface: #f9fafb;
  --white: #ffffff;
  --red: #dc2626;
  --green: #16a34a;
  --font: 'Inter', sans-serif;
}

body {
  font-family: var(--font);
  background: var(--white);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow-x: hidden;
}

/* Gradient blobs — same as homepage */
.blob { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
.blob-purple { width: 500px; height: 500px; background: #c4b5fd; opacity: 0.3; top: -120px; left: -100px; }
.blob-green  { width: 300px; height: 300px; background: #86efac; opacity: 0.22; bottom: -80px; left: 60px; }
.blob-yellow { width: 320px; height: 320px; background: #fde68a; opacity: 0.28; bottom: -100px; right: -60px; }
.blob-blue   { width: 240px; height: 240px; background: #bfdbfe; opacity: 0.28; top: 50px; right: -40px; }

/* NAV — matches homepage */
nav {
  position: relative; z-index: 10;
  height: 64px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 32px;
  justify-content: space-between;
}
.nav-logo {
  font-size: 1.15rem; font-weight: 800;
  color: var(--dark); text-decoration: none;
  letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px;
}
.nav-logo-icon {
  width: 30px; height: 30px; background: var(--purple);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
}
.nav-logo-icon svg { width: 16px; height: 16px; }
.nav-logo span { color: var(--purple); }

/* MAIN LAYOUT */
.page-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 32px 16px; position: relative; z-index: 1;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 20px;
  padding: 40px 40px 36px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 10px 40px rgba(0,0,0,0.07);
}

.card-logo {
  display: flex; align-items: center; justify-content: center;
  gap: 9px; margin-bottom: 6px;
}
.card-logo-icon {
  width: 34px; height: 34px; background: var(--purple);
  border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.card-logo-icon svg { width: 18px; height: 18px; }
.card-logo-text { font-size: 21px; font-weight: 800; color: var(--dark); letter-spacing: -0.3px; }
.card-logo-text span { color: var(--purple); }

.card-title { text-align: center; font-size: 1.35rem; font-weight: 700; color: var(--dark); margin-top: 14px; }
.card-sub { text-align: center; font-size: 13px; color: var(--muted); margin-top: 5px; margin-bottom: 28px; }

/* TABS */
.tabs {
  display: flex; background: var(--surface);
  border: 1px solid var(--border); border-radius: 100px;
  padding: 4px; margin-bottom: 24px; gap: 4px;
}
.tab {
  flex: 1; padding: 9px 14px; border: none;
  background: transparent; color: var(--muted);
  font-size: 0.85rem; font-weight: 600;
  cursor: pointer; border-radius: 100px;
  transition: all 0.2s; font-family: var(--font);
}
.tab.active { background: var(--dark); color: var(--white); }

/* FIELDS */
.field { margin-bottom: 16px; }
label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase; }

input[type=email], input[type=password], input[type=text], input[type=tel] {
  width: 100%; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 12px 14px; color: var(--text);
  font-size: 14px; font-family: var(--font); outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  -webkit-appearance: none;
}
input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(124,58,237,0.1); background: var(--white); }
input::placeholder { color: #d1d5db; }

/* ERROR */
.error-msg {
  display: none; background: #fef2f2; border: 1px solid #fecaca;
  color: var(--red); padding: 10px 14px; border-radius: 10px;
  font-size: 13px; margin-bottom: 14px;
}
.error-msg.show { display: block; }

/* SUCCESS */
.success-msg {
  display: none; background: #f0fdf4; border: 1px solid #bbf7d0;
  color: var(--green); padding: 10px 14px; border-radius: 10px;
  font-size: 13px; margin-bottom: 14px;
}
.success-msg.show { display: block; }

/* MAIN BUTTON — dark pill, matches "Browse Courses" on homepage */
.btn-main {
  width: 100%; background: var(--dark); color: var(--white);
  border: none; border-radius: 50px; padding: 13px 20px;
  font-weight: 700; font-size: 0.92rem; cursor: pointer;
  margin-top: 4px; transition: background 0.2s, box-shadow 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font);
}
.btn-main:hover:not(:disabled) { background: #1f2937; box-shadow: 0 4px 16px rgba(0,0,0,0.18); }
.btn-main:disabled { opacity: 0.55; cursor: not-allowed; }

/* DIVIDER */
.divider {
  display: flex; align-items: center; gap: 12px;
  margin: 18px 0; color: var(--muted); font-size: 12px; font-weight: 500;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* GOOGLE BTN */
.btn-google {
  width: 100%; background: var(--white); border: 1.5px solid var(--border);
  color: var(--text); border-radius: 50px; padding: 11px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: all 0.2s; font-family: var(--font);
}
.btn-google:hover { border-color: #9ca3af; background: var(--surface); }

/* FOOTER LINK */
.footer-link {
  text-align: center; margin-top: 16px;
  font-size: 13px; color: var(--muted);
}
.footer-link a, .footer-link span {
  color: var(--purple); font-weight: 600; cursor: pointer; text-decoration: none;
}

/* SPINNER */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: white;
  border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Trust row */
.trust-row {
  display: flex; justify-content: center; gap: 18px;
  margin-top: 20px; padding-top: 18px;
  border-top: 1px solid var(--border); flex-wrap: wrap;
}
.trust-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.trust-item::before { content: '✓'; color: var(--purple); font-weight: 700; }

/* MOBILE */
@media (max-width: 480px) {
  nav { padding: 0 16px; }
  .card { padding: 28px 20px 24px; border-radius: 16px; }
  .card-title { font-size: 1.2rem; }
  .page-wrap { padding: 20px 12px; align-items: flex-start; padding-top: 28px; }
  .trust-row { gap: 10px; }
}
</style>
</head>
<body>

<div class="blob blob-purple"></div>
<div class="blob blob-green"></div>
<div class="blob blob-yellow"></div>
<div class="blob blob-blue"></div>

<nav>
  <a class="nav-logo" href="/">
    <div class="nav-logo-icon">
      <svg viewBox="0 0 16 16" fill="none"><path d="M2 4l6 4.5L2 13V4zm6 0l6 4.5-6 4.5V4z" fill="white"/></svg>
    </div>
    Zenith <span>Zoom</span>
  </a>
  <a href="/" style="font-size:13px;color:var(--muted);text-decoration:none;font-weight:500;">← Back to Home</a>
</nav>

<div class="page-wrap">
  <div class="card">

    <div class="card-logo">
      <div class="card-logo-icon">
        <svg viewBox="0 0 18 18" fill="none"><path d="M2.5 4.5l6.5 5-6.5 5V4.5zm6.5 0l6.5 5-6.5 5V4.5z" fill="white"/></svg>
      </div>
      <div class="card-logo-text">Zenith <span>Zoom</span></div>
    </div>

    <div class="card-title" id="card-title">Welcome back 👋</div>
    <div class="card-sub" id="card-sub">Sign in to access your courses and certificates</div>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Create Account</button>
    </div>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <!-- SIGN IN FORM -->
    <div id="login-form">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn-main" onclick="login()" id="login-btn">
        <span id="login-btn-text">Sign In</span>
        <div class="spinner" id="login-spinner"></div>
        <svg id="login-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="footer-link" style="margin-top:12px">
        New here? <span onclick="switchTab('register')">Create a free account →</span>
      </div>
      <div class="divider">or</div>
      <button class="btn-google" onclick="googleLogin()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-form" style="display:none">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Jane Doe" autocomplete="name"/>
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>M-Pesa Number <span style="color:#9ca3af;font-weight:400;text-transform:none">(to link purchases)</span></label>
        <input type="tel" id="reg-phone" placeholder="0712 345 678" autocomplete="tel"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Min 6 characters" autocomplete="new-password"/>
      </div>
      <button class="btn-main" onclick="register()" id="reg-btn">
        <span id="reg-btn-text">Create Account</span>
        <div class="spinner" id="reg-spinner"></div>
        <svg id="reg-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="footer-link" style="margin-top:12px">
        Already have an account? <span onclick="switchTab('login')">Sign in →</span>
      </div>
      <div class="divider">or</div>
      <button class="btn-google" onclick="googleLogin()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign up with Google
      </button>
    </div>

    <div class="trust-row">
      <div class="trust-item">View instantly</div>
      <div class="trust-item">Pay via M-Pesa</div>
      <div class="trust-item">Access anytime</div>
    </div>

  </div>
</div>

<script>
const titles = {
  login: ['Welcome back 👋', 'Sign in to access your courses and certificates'],
  register: ['Create your account', 'Join Kenya\'s #1 career platform — free to sign up']
};

function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('card-title').textContent = titles[tab][0];
  document.getElementById('card-sub').textContent = titles[tab][1];
  clearMessages();
}

function clearMessages() {
  document.getElementById('error-msg').classList.remove('show');
  document.getElementById('success-msg').classList.remove('show');
}
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('success-msg').classList.remove('show');
}
function showSuccess(msg) {
  const el = document.getElementById('success-msg');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('error-msg').classList.remove('show');
}

function setLoading(type, loading) {
  const btn = document.getElementById(type + '-btn');
  const text = document.getElementById(type + '-btn-text');
  const spinner = document.getElementById(type + '-spinner');
  const arrow = document.getElementById(type + '-arrow');
  btn.disabled = loading;
  spinner.style.display = loading ? 'block' : 'none';
  arrow.style.display = loading ? 'none' : 'block';
  text.textContent = loading ? (type === 'login' ? 'Signing in...' : 'Creating account...') : (type === 'login' ? 'Sign In' : 'Create Account');
}

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) return showError('Please fill in all fields.');
  clearMessages(); setLoading('login', true);
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success) {
      showSuccess('Signed in! Redirecting...');
      const params = new URLSearchParams(window.location.search);
      const next      = params.get('next');
      const courseId  = params.get('courseId');
      const courseTitle = params.get('courseTitle');
      const coursePrice = params.get('coursePrice');
      let dest = '/dashboard';
      if (next === 'courses' && courseId) {
        dest = '/?next=courses&courseId=' + encodeURIComponent(courseId) + '&courseTitle=' + encodeURIComponent(courseTitle) + '&coursePrice=' + coursePrice;
      } else if (next === 'courses') {
        dest = '/?next=courses';
      }
      setTimeout(() => window.location = dest, 600);
    } else {
      showError(data.message || 'Invalid email or password.');
      setLoading('login', false);
    }
  } catch {
    showError('Connection error. Please try again.');
    setLoading('login', false);
  }
}

async function register() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!name || !email || !password) return showError('Please fill in all required fields.');
  if (password.length < 6) return showError('Password must be at least 6 characters.');
  clearMessages(); setLoading('reg', true);
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, email, password, phone })
    });
    const data = await res.json();
    if (data.success) {
      showSuccess('Account created! Redirecting...');
      const params = new URLSearchParams(window.location.search);
      const next      = params.get('next');
      const courseId  = params.get('courseId');
      const courseTitle = params.get('courseTitle');
      const coursePrice = params.get('coursePrice');
      let dest = '/dashboard';
      if (next === 'courses' && courseId) {
        dest = '/?next=courses&courseId=' + encodeURIComponent(courseId) + '&courseTitle=' + encodeURIComponent(courseTitle) + '&coursePrice=' + coursePrice;
      } else if (next === 'courses') {
        dest = '/?next=courses';
      }
      setTimeout(() => window.location = dest, 800);
    } else {
      showError(data.message || 'Registration failed. Please try again.');
      setLoading('reg', false);
    }
  } catch {
    showError('Connection error. Please try again.');
    setLoading('reg', false);
  }
}

function googleLogin() { window.location = '/api/auth/google'; }

// Auto-switch to register if URL has #register or ?tab=register
if (window.location.hash === '#register' || new URLSearchParams(window.location.search).get('tab') === 'register') {
  switchTab('register');
}

// URL message (e.g. ?msg=google-coming-soon)
const urlMsg = new URLSearchParams(window.location.search).get('msg');
const msgMap = {
  'google-coming-soon': 'Google sign-in is being set up. Please use email & password for now.',
  'google-not-configured': 'Google sign-in is not configured yet. Please use email & password.',
  'google-failed': 'Google sign-in failed. Please try again or use email & password.',
};
if (urlMsg && msgMap[urlMsg]) showError(msgMap[urlMsg]);

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const isLogin = document.getElementById('login-form').style.display !== 'none';
  isLogin ? login() : register();
});
</script>
</body>
</html>
