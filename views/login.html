<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Zenith Zoom</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Google Sans','Product Sans','Helvetica Neue',sans-serif; }
body { background:#F8F9FA; color:#202124; min-height:100vh; display:flex; flex-direction:column; }
nav { height:64px; background:#202124; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; padding:0 32px; }
.nav-logo { font-weight:700; font-size:1.2rem; color:#202124; cursor:pointer; text-decoration:none; font-family:'Google Sans Display','Google Sans',sans-serif; }
.nav-logo span { color:#8AB4F8; }
.container { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; }
.card { background:#ffffff; border:1px solid #DADCE0; border-radius:20px; padding:40px; width:100%; max-width:420px; }
.card-title { font-size:1.5rem; font-weight:700; margin-bottom:6px; color:#202124; }
.card-sub { color:#5F6368; font-size:0.88rem; margin-bottom:32px; }
.tabs { display:flex; gap:0; background:#F1F3F4; border-radius:100px; padding:4px; margin-bottom:28px; }
.tab { flex:1; padding:9px; border:none; background:transparent; color:#5F6368; font-size:0.85rem; font-weight:600; cursor:pointer; border-radius:100px; transition:all 0.2s; }
.tab.active { background:#1A73E8; color:#202124; }
.field { margin-bottom:16px; }
label { display:block; font-size:0.78rem; font-weight:700; color:#5F6368; margin-bottom:6px; letter-spacing:0.5px; }
input { width:100%; background:#F1F3F4; border:1px solid transparent; border-radius:100px; padding:12px 16px; color:#202124; font-size:0.92rem; outline:none; transition:border-color 0.2s; }
input:focus { border-color:#8AB4F8; }
input::placeholder { color:#9AA0A6; }
.btn-main { width:100%; background:#1A73E8; color:#202124; border:none; border-radius:100px; padding:13px; font-weight:800; font-size:0.95rem; cursor:pointer; margin-top:8px; transition:background 0.2s; }
.btn-main:hover { background:#1557B0; }
.btn-main:disabled { opacity:0.6; cursor:not-allowed; }
.divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:#9AA0A6; font-size:0.78rem; }
.divider::before, .divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.08); }
.btn-google { width:100%; background:#F1F3F4; border:1px solid transparent; color:#202124; border-radius:100px; padding:12px; font-size:0.88rem; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:all 0.2s; }
.btn-google:hover { border-color:#9AA0A6; background:rgba(255,255,255,0.09); }
.error-msg { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#f87171; padding:10px 14px; border-radius:100px; font-size:0.82rem; margin-bottom:16px; display:none; }
.error-msg.show { display:block; }
</style>
</head>
<body>
<nav><a class="nav-logo" href="/">Zenith <span>Zoom</span></a></nav>
<div class="container">
  <div class="card">
    <div class="card-title">Welcome back 👋</div>
    <div class="card-sub">Sign in to access your purchased courses</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('register')">Create Account</button>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <!-- LOGIN -->
    <div id="login-form">
      <div class="field"><label>EMAIL</label><input type="email" id="login-email" placeholder="you@example.com" /></div>
      <div class="field"><label>PASSWORD</label><input type="password" id="login-password" placeholder="••••••••" /></div>
      <button class="btn-main" onclick="login()" id="login-btn">Sign In</button>
      <p style="text-align:center;margin-top:14px;font-size:0.82rem;color:rgba(255,255,255,0.4);">
        New here? <span onclick="switchTab('register')" style="color:#8AB4F8;cursor:pointer;font-weight:700;">Create a free account →</span>
      </p>
      <div class="divider">or</div>
      <button class="btn-google" onclick="googleLogin()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- REGISTER -->
    <div id="register-form" style="display:none">
      <div class="field"><label>FULL NAME</label><input type="text" id="reg-name" placeholder="John Doe" /></div>
      <div class="field"><label>EMAIL</label><input type="email" id="reg-email" placeholder="you@example.com" /></div>
      <div class="field"><label>M-PESA NUMBER <span style="color:rgba(255,255,255,0.4);font-weight:400">(to link purchases)</span></label><input type="tel" id="reg-phone" placeholder="0716762062" /></div>
      <div class="field"><label>PASSWORD</label><input type="password" id="reg-password" placeholder="Min 6 characters" /></div>
      <button class="btn-main" onclick="register()" id="reg-btn">Create Account</button>
      <div class="divider">or</div>
      <button class="btn-google" onclick="googleLogin()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign up with Google
      </button>
    </div>
  </div>
</div>
<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
  document.getElementById('login-form').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab==='register' ? 'block' : 'none';
  showError('');
}
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}
async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) return showError('Please fill in all fields');
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password}) });
    const data = await res.json();
    if (data.success) window.location = '/dashboard';
    else { 
      showError(data.message + ' — or create a new account below.');
      btn.disabled=false; btn.textContent='Sign In'; 
    }
  } catch { showError('Network error. Try again.'); btn.disabled=false; btn.textContent='Sign In'; }
}
async function register() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!name||!email||!password) return showError('Please fill in all fields');
  if (password.length < 6) return showError('Password must be at least 6 characters');
  const btn = document.getElementById('reg-btn');
  btn.disabled=true; btn.textContent='Creating account...';
  try {
    const res = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,email,password,phone}) });
    const data = await res.json();
    if (data.success) window.location = '/dashboard';
    else { showError(data.message); btn.disabled=false; btn.textContent='Create Account'; }
  } catch { showError('Network error. Try again.'); btn.disabled=false; btn.textContent='Create Account'; }
}
function googleLogin() { window.location = '/api/auth/google'; }
// Auto-switch to register tab if URL has #register
if (window.location.hash === '#register') switchTab('register');

// Enter key support
document.addEventListener('keydown', e => { if (e.key==='Enter') { const lf=document.getElementById('login-form'); if(lf.style.display!=='none') login(); else register(); } });
</script>
</body>
</html>
