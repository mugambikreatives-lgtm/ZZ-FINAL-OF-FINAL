<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Dashboard — Zenith Zoom</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; }
:root { --teal:#00c2d4; --dark:#0a0f1a; --card:#111827; --border:rgba(255,255,255,0.08); --muted:rgba(255,255,255,0.45); }
body { background:var(--dark); color:#fff; min-height:100vh; }

/* NAV */
nav { position:fixed; top:0; left:0; right:0; z-index:100; height:64px; background:rgba(10,15,26,0.95); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 32px; }
.nav-logo { font-weight:900; font-size:1.2rem; color:#fff; cursor:pointer; }
.nav-logo span { color:var(--teal); }
.nav-right { display:flex; align-items:center; gap:16px; }
.nav-user { display:flex; align-items:center; gap:10px; font-size:0.85rem; }
.nav-avatar { width:34px; height:34px; border-radius:50%; background:var(--teal); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.85rem; color:#000; }
.btn-logout { background:transparent; border:1px solid var(--border); color:var(--muted); padding:7px 16px; border-radius:8px; cursor:pointer; font-size:0.8rem; transition:all 0.2s; }
.btn-logout:hover { border-color:var(--teal); color:var(--teal); }

/* MAIN */
main { padding-top:64px; }
.dashboard { max-width:1200px; margin:0 auto; padding:40px 24px; }

/* STATS */
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:40px; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; }
.stat-card .num { font-size:2rem; font-weight:900; color:var(--teal); }
.stat-card .label { font-size:0.8rem; color:var(--muted); margin-top:4px; }

/* COURSES GRID */
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.section-title { font-size:1.2rem; font-weight:800; }
.courses-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; margin-bottom:48px; }

.course-card { background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; transition:all 0.2s; cursor:pointer; }
.course-card:hover { border-color:rgba(0,194,212,0.4); transform:translateY(-2px); }
.course-thumb { height:140px; background:linear-gradient(135deg,#0d2137,#1e3a5f); display:flex; align-items:center; justify-content:center; font-size:3rem; position:relative; }
.course-badge { position:absolute; top:10px; right:10px; background:rgba(0,194,212,0.2); border:1px solid var(--teal); color:var(--teal); font-size:0.7rem; font-weight:700; padding:3px 8px; border-radius:6px; }
.course-body { padding:18px; }
.course-title { font-size:0.95rem; font-weight:700; margin-bottom:6px; }
.course-meta { font-size:0.78rem; color:var(--muted); margin-bottom:14px; }
.progress-bar-wrap { background:rgba(255,255,255,0.08); border-radius:100px; height:6px; margin-bottom:8px; }
.progress-bar { background:var(--teal); border-radius:100px; height:6px; transition:width 0.5s; }
.progress-label { font-size:0.72rem; color:var(--muted); display:flex; justify-content:space-between; }
.btn-read { margin-top:14px; width:100%; background:var(--teal); color:#000; border:none; border-radius:10px; padding:10px; font-weight:800; font-size:0.85rem; cursor:pointer; transition:background 0.2s; }
.btn-read:hover { background:#00dff0; }
.btn-read.completed { background:rgba(34,197,94,0.2); color:#4ade80; border:1px solid rgba(34,197,94,0.3); }

/* EMPTY STATE */
.empty { text-align:center; padding:60px 20px; color:var(--muted); }
.empty-icon { font-size:3rem; margin-bottom:16px; }
.empty h3 { font-size:1.1rem; color:#fff; margin-bottom:8px; }
.empty p { font-size:0.88rem; margin-bottom:24px; }
.btn-browse { background:var(--teal); color:#000; border:none; border-radius:10px; padding:12px 28px; font-weight:800; cursor:pointer; font-size:0.9rem; }

/* PDF VIEWER MODAL */
.viewer-modal { display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.95); flex-direction:column; }
.viewer-modal.open { display:flex; }
.viewer-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:var(--card); border-bottom:1px solid var(--border); flex-shrink:0; }
.viewer-title { font-weight:700; font-size:0.95rem; }
.viewer-controls { display:flex; align-items:center; gap:12px; }
.viewer-close { background:transparent; border:1px solid var(--border); color:#fff; padding:7px 16px; border-radius:8px; cursor:pointer; font-size:0.8rem; }
.viewer-close:hover { border-color:#ef4444; color:#ef4444; }
.viewer-body { flex:1; overflow:hidden; }
.viewer-body iframe { width:100%; height:100%; border:none; }
.viewer-footer { padding:12px 24px; background:var(--card); border-top:1px solid var(--border); display:flex; align-items:center; justify-content:center; gap:16px; font-size:0.82rem; color:var(--muted); }

/* TOAST */
.toast { position:fixed; bottom:24px; right:24px; background:#1e293b; border:1px solid var(--border); border-radius:12px; padding:14px 20px; font-size:0.85rem; z-index:9999; animation:slideIn 0.3s ease; }
.toast.success { border-color:rgba(34,197,94,0.4); color:#4ade80; }
.toast.error { border-color:rgba(239,68,68,0.4); color:#f87171; }
@keyframes slideIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

@media(max-width:768px) {
  .stats-row { grid-template-columns:repeat(2,1fr); }
  nav { padding:0 16px; }
  .dashboard { padding:24px 16px; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="window.location='/'">Zenith <span>Zoom</span></div>
  <div class="nav-right">
    <div class="nav-user">
      <div class="nav-avatar" id="nav-avatar">?</div>
      <span id="nav-name">Loading...</span>
    </div>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
</nav>

<main>
  <div class="dashboard">

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card"><div class="num" id="stat-courses">0</div><div class="label">Courses Purchased</div></div>
      <div class="stat-card"><div class="num" id="stat-completed">0</div><div class="label">Completed</div></div>
      <div class="stat-card"><div class="num" id="stat-progress">0%</div><div class="label">Avg Progress</div></div>
      <div class="stat-card"><div class="num" id="stat-streak">🔥 0</div><div class="label">Day Streak</div></div>
    </div>

    <!-- MY COURSES -->
    <div class="section-header">
      <div class="section-title">📚 My Courses</div>
      <button class="btn-browse" onclick="window.location='/'">Browse More</button>
    </div>
    <div class="courses-grid" id="courses-grid">
      <div style="color:var(--muted);padding:20px">Loading your courses...</div>
    </div>

  </div>
</main>

<!-- PDF VIEWER -->
<div class="viewer-modal" id="viewer-modal">
  <div class="viewer-header">
    <div class="viewer-title" id="viewer-title">Course Viewer</div>
    <div class="viewer-controls">
      <span id="viewer-progress-label" style="font-size:0.8rem;color:var(--muted)"></span>
      <button class="viewer-close" onclick="closeViewer()">✕ Close</button>
    </div>
  </div>
  <div class="viewer-body">
    <iframe id="viewer-iframe" src="" allowfullscreen></iframe>
  </div>
  <div class="viewer-footer">
    <span>🔒 This content is protected. Viewing is only available to paid users.</span>
  </div>
</div>

<script>
const icons = { Business:'💼', Technology:'💻', Marketing:'📣', Leadership:'🏆', Finance:'💰', 'Career Development':'🚀' };
let currentUser = null;
let currentCourseId = null;

async function init() {
  try {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (!data.success) { window.location = '/login'; return; }
    currentUser = data.user;
    document.getElementById('nav-name').textContent = currentUser.name;
    document.getElementById('nav-avatar').textContent = currentUser.name[0].toUpperCase();
    renderDashboard();
  } catch {
    window.location = '/login';
  }
}

function renderDashboard() {
  const courses = currentUser.purchasedCourses || [];
  const completed = courses.filter(c => c.completed).length;
  const avgProgress = courses.length ? Math.round(courses.reduce((s,c) => s + (c.progress||0), 0) / courses.length) : 0;

  document.getElementById('stat-courses').textContent = courses.length;
  document.getElementById('stat-completed').textContent = completed;
  document.getElementById('stat-progress').textContent = avgProgress + '%';

  const grid = document.getElementById('courses-grid');
  if (!courses.length) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="empty-icon">📚</div>
        <h3>No courses yet</h3>
        <p>Purchase a course to start learning</p>
        <button class="btn-browse" onclick="window.location='/'">Browse Courses</button>
      </div>`;
    return;
  }

  grid.innerHTML = courses.map(c => {
    const course = c.courseId;
    if (!course) return '';
    const icon = icons[course.category] || '📄';
    const prog = c.progress || 0;
    return `
      <div class="course-card" onclick="openViewer('${course._id}','${course.title.replace(/'/g,"\\'")}')">
        <div class="course-thumb">
          ${icon}
          ${c.completed ? '<div class="course-badge">✅ Done</div>' : ''}
        </div>
        <div class="course-body">
          <div class="course-title">${course.title}</div>
          <div class="course-meta">${course.category}</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar" style="width:${prog}%"></div>
          </div>
          <div class="progress-label">
            <span>Progress</span>
            <span>${prog}%</span>
          </div>
          <button class="btn-read ${c.completed ? 'completed' : ''}" onclick="event.stopPropagation();openViewer('${course._id}','${course.title.replace(/'/g,"\\'")}')">
            ${c.completed ? '✅ Completed' : prog > 0 ? '▶ Continue Reading' : '▶ Start Reading'}
          </button>
        </div>
      </div>`;
  }).join('');
}

async function openViewer(courseId, title) {
  currentCourseId = courseId;
  document.getElementById('viewer-title').textContent = title;
  document.getElementById('viewer-iframe').src = '';
  document.getElementById('viewer-modal').classList.add('open');
  document.getElementById('viewer-progress-label').textContent = 'Loading...';

  try {
    const res = await fetch(`/api/auth/view/${courseId}`);
    const data = await res.json();
    if (!data.success) { showToast('Could not load course. Try again.', 'error'); closeViewer(); return; }
    // Use PDF.js viewer with the URL
    const pdfJsUrl = `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(data.url)}`;
    document.getElementById('viewer-iframe').src = pdfJsUrl;
    document.getElementById('viewer-progress-label').textContent = '📄 Viewing';

    // Update progress to at least 10% when opened
    const course = currentUser.purchasedCourses.find(c => c.courseId?._id === courseId || c.courseId === courseId);
    if (course && (course.progress || 0) < 10) {
      updateProgress(courseId, 10);
    }
  } catch {
    showToast('Failed to load course', 'error');
    closeViewer();
  }
}

function closeViewer() {
  document.getElementById('viewer-modal').classList.remove('open');
  document.getElementById('viewer-iframe').src = '';
}

async function updateProgress(courseId, progress) {
  try {
    await fetch('/api/auth/progress', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ courseId, progress })
    });
    // Update local state
    const course = currentUser.purchasedCourses.find(c => (c.courseId?._id || c.courseId) === courseId);
    if (course) { course.progress = Math.max(course.progress || 0, progress); renderDashboard(); }
  } catch {}
}

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location = '/';
}

function showToast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

init();
</script>
</body>
</html>
