<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — ZenithZoom</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-purple {
      width: 420px; height: 420px;
      background: #c4b5fd;
      opacity: 0.45;
      top: -100px; left: -80px;
    }
    .blob-green {
      width: 260px; height: 260px;
      background: #86efac;
      opacity: 0.35;
      bottom: -60px; left: 60px;
    }
    .blob-yellow {
      width: 280px; height: 280px;
      background: #fde68a;
      opacity: 0.4;
      bottom: -80px; right: -50px;
    }
    .blob-purple2 {
      width: 220px; height: 220px;
      background: #a78bfa;
      opacity: 0.25;
      top: 40px; right: -40px;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 20px;
      padding: 44px 48px 40px;
      width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      justify-content: center;
      margin-bottom: 6px;
    }
    .logo-icon {
      width: 30px; height: 30px;
      background: #7c3aed;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 17px; height: 17px; }
    .logo-text {
      font-size: 21px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.3px;
    }
    .logo-text span { color: #7c3aed; }

    .subtitle {
      text-align: center;
      font-size: 12.5px;
      color: #94a3b8;
      margin-bottom: 32px;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .divider-line { flex: 1; height: 1px; background: #f1f5f9; }
    .divider-label {
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 7px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      color: #1e293b;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
      background: #fff;
    }
    input::placeholder { color: #cbd5e1; }

    .btn {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #0f172a;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }
    .btn:hover { background: #1e293b; }
    .btn:active { transform: scale(0.99); }
    .btn svg { width: 16px; height: 16px; }

    .trust {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #64748b;
    }
    .trust-item svg { width: 13px; height: 13px; flex-shrink: 0; }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.15s;
    }
    .back:hover { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="blob blob-purple"></div>
  <div class="blob blob-green"></div>
  <div class="blob blob-yellow"></div>
  <div class="blob blob-purple2"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 4.5l5.5 4-5.5 4V4.5zm5.5 0L14 8.5l-5.5 4V4.5z" fill="white" opacity="0.9"/>
        </svg>
      </div>
      <div class="logo-text">Zenith<span>Zoom</span></div>
    </div>
    <p class="subtitle">Admin Panel — Authorized Access Only</p>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-label">Sign in to continue</span>
      <div class="divider-line"></div>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="admin@zenithzoom.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn" onclick="handleLogin()">
      Sign In to Admin Panel
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="trust">
      <div class="trust-item">
        <svg viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 6.5l3 3 5-5" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Secure access
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 6.5l3 3 5-5" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Authorized only
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 6.5l3 3 5-5" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Encrypted
      </div>
    </div>

    <a href="/" class="back">← Back to Zenith Zoom</a>
  </div>

  <script>
    function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) {
        alert('Please enter your email and password.');
        return;
      }
      // Hook up to your auth logic here
    }
  </script>
</body>
</html>
